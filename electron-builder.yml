appId: com.silver.claude-terminal
productName: Claude Terminal
copyright: Copyright © 2026

directories:
  output: release
  buildResources: resources

# 关键：禁掉 electron-builder 自动 rebuild 原生依赖。
# @lydell/node-pty 自带 N-API 预编译二进制，rebuild 反而会触发本机现场编译（需 VS C++ Build Tools）。
# 见 docs/PLAN.md §6.1
npmRebuild: false

# 把 @lydell/node-pty 整体解到 app.asar.unpacked 下，
# 让 require('@lydell/node-pty') 能加载到里面的 .node 文件 + OpenConsole.exe + conpty.dll
asarUnpack:
  - '**/node_modules/@lydell/**'

files:
  - out/**/*
  - resources/**/*
  - package.json
  - '!**/*.map'
  - '!**/test/**'
  - '!**/tests/**'

win:
  icon: resources/icon.ico
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - target: nsis
      arch: x64
    - target: zip
      arch: x64

# macOS：内部自用，不签名（identity: null）。universal 同时覆盖 Intel + Apple Silicon。
# icon.icns 需先用 scripts/generate-icns 从 icon.png 生成（见 docs/MAC.md）。
# 注意：mac target 只能在 macOS 上构建，Windows 上执行 dist:mac 会失败。
mac:
  category: public.app-category.developer-tools
  icon: resources/icon.icns
  artifactName: ${productName}-${version}-${arch}.${ext}
  identity: null            # 不做代码签名/公证（首次打开需右键→打开绕过 Gatekeeper）
  hardenedRuntime: false
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Claude Terminal
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  deleteAppDataOnUninstall: false
  # 自定义脚本：注册资源管理器"在此处打开 Claude Terminal"右键菜单，卸载时清理
  include: scripts/installer.nsh
