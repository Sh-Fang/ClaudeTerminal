appId: com.silver.claude-terminal
productName: Claude Terminal
copyright: Copyright © 2026

directories:
  output: release
  buildResources: resources

# 禁掉自动 rebuild：@lydell/node-pty 自带 N-API 预编译二进制，rebuild 反而触发本机现场编译
npmRebuild: false

# electron-updater 更新源：据此生成 app-update.yml（打进应用）与 latest.yml（CI 上传到 Release）；
# CI 构建带 --publish never，实际发布由 workflow 的 release action 完成
publish:
  provider: github
  owner: Sh-Fang
  repo: ClaudeTerminal

# @lydell/node-pty 解到 app.asar.unpacked，require 才能加载 .node / OpenConsole.exe / conpty.dll
asarUnpack:
  - '**/node_modules/@lydell/**'

files:
  - out/**/*
  - resources/**/*
  - package.json
  - '!**/*.map'
  - '!**/test/**'
  - '!**/tests/**'

win:
  icon: resources/icon.ico
  # 不用 ${productName}：带空格的文件名上传 GitHub 会被改名（空格→点），
  # 与 latest.yml 里净化后的 URL（空格→横杠）对不上，electron-updater 下载 404
  artifactName: Claude-Terminal-${version}-${arch}.${ext}
  target:
    - target: nsis
      arch: x64
    - target: zip
      arch: x64

# macOS：不签名；icon.icns 先用 scripts/generate-icns.sh 生成；mac target 只能在 macOS 上构建
mac:
  category: public.app-category.developer-tools
  icon: resources/icon.icns
  artifactName: Claude-Terminal-${version}-${arch}.${ext}
  identity: null            # 不签名/公证，首次打开需右键→打开绕过 Gatekeeper
  hardenedRuntime: false
  target:
    - target: dmg
      arch: universal
    - target: zip
      arch: universal

dmg:
  artifactName: Claude-Terminal-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Claude Terminal
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  deleteAppDataOnUninstall: false
  # 注册资源管理器"在此处打开"右键菜单，卸载时清理
  include: scripts/installer.nsh
