<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>Claude Terminal</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <div class="titlebar">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2.5" y="4" width="19" height="16" rx="2.5"/>
            <polyline points="6.5 9 10 12 6.5 15"/>
            <line x1="12.5" y1="15" x2="17.5" y2="15"/>
          </svg>
        </span>
        Claude Terminal
      </div>
      <div class="titlebar-spacer"></div>
      <div class="win-ctrls" aria-label="窗口控制">
        <button id="win-min" class="win-btn c-min" title="最小化" aria-label="最小化">
          <svg viewBox="0 0 10 10" width="6" height="2" aria-hidden="true"><path d="M1 5 H9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg>
        </button>
        <button id="win-max" class="win-btn c-max" title="最大化" aria-label="最大化">
          <svg viewBox="0 0 10 10" width="6" height="6" aria-hidden="true"><path d="M2 5 H8 M5 2 V8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg>
        </button>
        <button id="win-close" class="win-btn c-close" title="关闭" aria-label="关闭">
          <svg viewBox="0 0 10 10" width="6" height="6" aria-hidden="true"><path d="M1.5 1.5 L8.5 8.5 M8.5 1.5 L1.5 8.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg>
        </button>
      </div>
    </div>
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <!-- 打开的分组：占满剩余高度，超长时在本区内部滚动 -->
        <section class="side-section side-open">
          <div class="side-section-label">
            打开的分组<span class="line"></span>
            <button id="sidebarCollapseBtn" class="side-head-btn" type="button" title="收起侧边栏" aria-label="收起侧边栏">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m15 6-6 6 6 6"/>
              </svg>
            </button>
          </div>
          <div class="side-open-scroll">
            <div id="groupList"></div>
            <div class="new-group-btn" id="newGroupBtn" title="新建分组">
              <span class="ic"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></span>新建分组
            </div>
          </div>
        </section>
        <!-- 已保存的分组：固定在底部，点标题可收起 -->
        <section class="side-section side-saved" id="savedSection">
          <button class="side-section-label saved-toggle" id="savedToggle" type="button" title="收起 / 展开已保存的分组">
            <span class="saved-caret"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></span>
            已保存的分组<span class="line"></span>
          </button>
          <div class="side-saved-body">
            <div id="savedList"></div>
            <div class="manage-saved-btn" id="manageSavedBtn" title="管理全部已保存的分组">
              <span class="ic"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></span>展开管理
            </div>
          </div>
        </section>
        <!-- Claude 账号用量：固定在侧边栏最底部 -->
        <section class="side-usage" id="usagePanel" hidden>
          <div id="usageBars" class="usage-bars"></div>
        </section>
        <div id="sidebarResizer" class="sidebar-resizer" title="拖动调整宽度" aria-hidden="true"></div>
      </aside>
      <div id="sidebarHandle" class="sidebar-handle" hidden title="展开侧边栏（hover 预览）">
        <span class="sh-ic"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="2"/>
          <line x1="9" y1="4" x2="9" y2="20"/>
        </svg></span>
        <span class="sh-chevron"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m9 6 6 6-6 6"/>
        </svg></span>
      </div>

      <div class="main">
        <div class="toolbar">
          <div class="crumb">
            <span class="g" id="cbGroup"></span>
            <span class="sep">›</span>
            <span class="t" id="cbTab"></span>
            <span id="cbStatus"></span>
          </div>
          <div class="spacer"></div>
          <div class="session-select" id="sessionSelect" title="切换会话">
            <span class="clock"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
            <span class="time" id="sessTime"></span>
            <span class="title" id="sessTitle"></span>
            <span class="caret"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>
          </div>
          <button class="tool-icon-btn" id="settingsBtn" title="设置" aria-label="设置"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
          <div class="session-menu" id="sessionMenu">
            <div class="menu-eyebrow">本标签的会话（栈顶 = 当前）</div>
            <div id="sessList"></div>
            <div class="menu-foot">
              <span class="dot"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></span>
              <span>终端里 <code>/clear</code> 会自动在此新增一条会话</span>
            </div>
          </div>
        </div>

        <div id="hosts">
          <div id="hosts-empty">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2.5" y="4" width="19" height="16" rx="2.5"/>
              <polyline points="6.5 9 10 12 6.5 15"/>
              <line x1="12.5" y1="15" x2="17.5" y2="15"/>
            </svg>
            <div class="hint">没有打开的会话</div>
            <div class="sub">左侧点「新建分组」开始，或从「已保存的分组」恢复</div>
          </div>
        </div>

        <div id="search" role="search" aria-label="终端内搜索">
          <input id="search-input" type="text" placeholder="搜索（Enter 下一个，Shift+Enter 上一个）" autocomplete="off" spellcheck="false" />
          <span id="search-count" aria-live="polite"></span>
          <button id="search-close" title="关闭 (Esc)" aria-label="关闭搜索"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
        </div>

        <div class="statusbar">
          <span id="sbCwd"></span>
          <span id="sbSession" class="sb-session" hidden></span>
        </div>

        <div id="toast" class="toast"><span id="toastMsg"></span></div>
      </div>
    </div>

    <div class="ctx" id="ctx"></div>

    <div id="scrim" class="scrim" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h2 id="modal-title">新建标签</h2>
        <p class="sub" id="modal-sub">一个标签 = 一个 pwsh 会话。</p>
        <div class="field" id="modal-name-field">
          <label for="modal-name">名称</label>
          <input id="modal-name" type="text" autocomplete="off" spellcheck="false" />
        </div>
        <div class="field" id="modal-cwd-field">
          <label for="modal-cwd">路径 (cwd)</label>
          <div class="row-with-btn">
            <input id="modal-cwd" class="mono" type="text" autocomplete="off" spellcheck="false" />
            <button id="modal-cwd-pick" class="btn btn-secondary" type="button" title="选择目录">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              </svg>
              <span>浏览</span>
            </button>
          </div>
        </div>
        <div class="field" id="modal-tabname-field">
          <label for="modal-tabname">首个标签名</label>
          <input id="modal-tabname" type="text" autocomplete="off" spellcheck="false" />
        </div>
        <div class="field-check" id="modal-cc-field">
          <label>
            <input id="modal-cc" type="checkbox" checked />
            <span>自动启动 Claude Code（首次绑定 UUID，之后 <code>--resume</code>）</span>
          </label>
        </div>
        <div class="actions">
          <button id="modal-cancel" class="btn btn-secondary">取消</button>
          <button id="modal-ok" class="btn btn-primary">创建</button>
        </div>
      </div>
    </div>

    <div id="pickScrim" class="scrim" hidden>
      <div class="modal modal-pick">
        <h2 id="pk-title">恢复标签</h2>
        <p class="sub" id="pk-sub"></p>
        <div class="pk-toolbar">
          <button id="pk-all" type="button" class="link-btn">全选</button>
          <span class="dot-sep">·</span>
          <button id="pk-none" type="button" class="link-btn">取消全选</button>
          <span id="pk-count" class="pk-count"></span>
        </div>
        <div id="pk-list" class="pk-list"></div>
        <div class="actions">
          <button id="pk-cancel" class="btn btn-secondary">取消</button>
          <button id="pk-ok" class="btn btn-primary">恢复</button>
        </div>
      </div>
    </div>

    <div id="manageScrim" class="scrim" hidden>
      <div class="modal modal-manage" role="dialog" aria-modal="true" aria-labelledby="mg-title">
        <div class="mg-head">
          <div>
            <h2 id="mg-title">管理已保存的分组</h2>
            <p class="sub">拖动调整顺序；前 <b id="mg-limit-n">4</b> 个会展示在侧边栏。点名称可重命名，展开可管理标签。</p>
          </div>
          <button id="mg-close" class="mg-close-btn" type="button" aria-label="关闭">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="mg-body" id="mg-body"></div>
        <div class="mg-empty" id="mg-empty" hidden>
          <div>还没有已保存的分组。</div>
          <div class="sub">右键打开的分组「保存分组」就会出现在这里。</div>
        </div>
      </div>
    </div>

    <div id="confirmScrim" class="scrim" hidden>
      <div class="modal modal-confirm">
        <h2 id="cf-title">确认</h2>
        <div class="cf-body" id="cf-msg"></div>
        <div class="actions">
          <button id="cf-cancel" class="btn btn-secondary">取消</button>
          <button id="cf-ok" class="btn btn-danger">确认</button>
        </div>
      </div>
    </div>

    <div id="settingsScrim" class="scrim" hidden>
      <div class="modal settings-modal" role="dialog" aria-modal="true" aria-labelledby="set-title">
        <div class="settings-layout">
          <nav class="settings-nav" aria-label="设置分区">
            <button class="set-nav-item active" data-section="appearance" type="button">
              <span class="ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18 4.5 4.5 0 0 1 0-9 4.5 4.5 0 0 0 0-9z"/></svg></span>
              外观
            </button>
            <button class="set-nav-item" data-section="general" type="button">
              <span class="ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg></span>
              通用
            </button>
            <button class="set-nav-item" data-section="terminal" type="button">
              <span class="ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="16" rx="2.5"/><polyline points="6.5 9 10 12 6.5 15"/><line x1="12.5" y1="15" x2="17.5" y2="15"/></svg></span>
              终端
            </button>
            <button class="set-nav-item" data-section="defaults" type="button">
              <span class="ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></span>
              新建默认值
            </button>
            <button class="set-nav-item" data-section="claude" type="button">
              <span class="ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 0-9 9"/><path d="M12 3v9l6 3"/></svg></span>
              Claude Code
            </button>
          </nav>

          <div class="settings-pane">
            <h2 id="set-title" class="set-pane-title">设置</h2>

            <div class="set-section" data-section="appearance">
              <div class="set-row">
                <label for="set-font-family">字体族</label>
                <input id="set-font-family" class="mono" type="text" autocomplete="off" spellcheck="false" />
              </div>
              <div class="set-row two">
                <div>
                  <label for="set-font-size">字号 (px)</label>
                  <input id="set-font-size" type="number" min="8" max="40" step="1" />
                </div>
                <div>
                  <label for="set-line-height">行高</label>
                  <input id="set-line-height" type="number" min="1.0" max="2.0" step="0.05" />
                </div>
              </div>
              <div class="set-row">
                <label>主题</label>
                <div class="seg-group" id="set-theme" role="radiogroup" aria-label="主题">
                  <button class="seg-item" data-val="vscode-dark" type="button" role="radio">VSCode Dark</button>
                  <button class="seg-item" data-val="vercel-dark" type="button" role="radio">Vercel Dark</button>
                  <button class="seg-item" data-val="one-light" type="button" role="radio">One Light</button>
                </div>
              </div>
            </div>

            <div class="set-section" data-section="general" hidden>
              <div class="set-row">
                <label>侧边栏显示的「已保存分组」数量（0 = 仅在管理页）</label>
                <div class="seg-group" id="set-saved-limit" role="radiogroup" aria-label="已保存分组数量">
                  <button class="seg-item" data-val="0" type="button" role="radio">0</button>
                  <button class="seg-item" data-val="1" type="button" role="radio">1</button>
                  <button class="seg-item" data-val="2" type="button" role="radio">2</button>
                  <button class="seg-item" data-val="3" type="button" role="radio">3</button>
                  <button class="seg-item" data-val="4" type="button" role="radio">4</button>
                  <button class="seg-item" data-val="5" type="button" role="radio">5</button>
                </div>
              </div>
              <div class="set-row">
                <label>完成/待办绿点停留时间</label>
                <div class="seg-group" id="set-downgrade-sec" role="radiogroup" aria-label="绿点停留时间">
                  <button class="seg-item" data-val="1" type="button" role="radio">1s</button>
                  <button class="seg-item" data-val="2" type="button" role="radio">2s</button>
                  <button class="seg-item" data-val="3" type="button" role="radio">3s</button>
                  <button class="seg-item" data-val="4" type="button" role="radio">4s</button>
                  <button class="seg-item" data-val="5" type="button" role="radio">5s</button>
                </div>
              </div>
              <div class="field-check">
                <label>
                  <input id="set-confirm-close" type="checkbox" />
                  <span>关闭未保存的分组前二次确认</span>
                </label>
              </div>
            </div>

            <div class="set-section" data-section="terminal" hidden>
              <div class="set-row">
                <label>光标样式</label>
                <div class="seg-group" id="set-cursor-style" role="radiogroup" aria-label="光标样式">
                  <button class="seg-item" data-val="block" type="button" role="radio">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><rect x="2" y="3" width="6" height="8" fill="currentColor"/></svg>
                    <span>block</span>
                  </button>
                  <button class="seg-item" data-val="underline" type="button" role="radio">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><rect x="2" y="10" width="6" height="2" fill="currentColor"/></svg>
                    <span>underline</span>
                  </button>
                  <button class="seg-item" data-val="bar" type="button" role="radio">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><rect x="2" y="3" width="2" height="8" fill="currentColor"/></svg>
                    <span>bar</span>
                  </button>
                </div>
              </div>
              <div class="set-row">
                <label for="set-scrollback">回滚缓冲（行）</label>
                <input id="set-scrollback" type="number" min="100" max="100000" step="500" />
              </div>
              <div class="field-check">
                <label>
                  <input id="set-cursor-blink" type="checkbox" />
                  <span>光标闪烁</span>
                </label>
              </div>
            </div>

            <div class="set-section" data-section="defaults" hidden>
              <div class="set-row">
                <label for="set-default-cwd">默认新建分组路径</label>
                <div class="row-with-btn">
                  <input id="set-default-cwd" class="mono" type="text" autocomplete="off" spellcheck="false" />
                  <button id="set-default-cwd-pick" class="btn btn-secondary" type="button" title="选择目录">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    </svg>
                    <span>浏览</span>
                  </button>
                </div>
              </div>
              <div class="field-check">
                <label>
                  <input id="set-default-cc" type="checkbox" />
                  <span>新建标签默认勾选「自动启动 Claude Code」</span>
                </label>
              </div>
            </div>

            <div class="set-section" data-section="claude" hidden>
              <div class="set-row">
                <label for="set-claude-path">claude 可执行路径（留空 = 走 PATH）</label>
                <div class="row-with-btn">
                  <input id="set-claude-path" class="mono" type="text" autocomplete="off" spellcheck="false"
                    placeholder="例如 C:\nvm4w\nodejs\claude.cmd" />
                  <button id="set-claude-detect" class="btn btn-secondary" type="button">自动检测</button>
                </div>
              </div>
              <div class="field-check">
                <label>
                  <input id="set-disable-update" type="checkbox" />
                  <span>禁止 cc 自动升级（写 <code>DISABLE_AUTOUPDATER=1</code> 到 Windows 用户环境变量，所有终端生效）</span>
                </label>
                <div id="set-disable-update-status" class="set-hint"></div>
              </div>
              <div class="field-check">
                <label>
                  <input id="set-show-usage" type="checkbox" />
                  <span>底部状态栏显示 Claude 用量（5h / 周 利用率与重置时间）</span>
                </label>
