<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>Floater</title>
    <style>
      html, body {
        margin: 0; padding: 0; height: 100%;
        background: transparent;
        user-select: none; -webkit-user-select: none;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        color: #f5f5f5;
        overflow: hidden;
        cursor: default;
      }
      /* 卡片本身尺寸固定；窗口被右键菜单临时撑大时它不跟着拉伸。
         去掉外 drop-shadow —— 窗口透明，阴影投在空气里看着像污渍 */
      .card {
        box-sizing: border-box;
        position: absolute;
        top: 0; left: 0;
        width: 140px; height: 44px;
        background: rgba(23, 23, 23, 0.92);
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 6px 12px;
        display: flex; align-items: center; justify-content: center; gap: 12px;
        -webkit-app-region: drag;
        backdrop-filter: blur(10px);
      }
      /* 菜单打开时给卡片加个 no-drag 标记 —— 让 mousedown 能正常派发到 renderer，
         否则点卡片会被 OS 当成拖动起点，关菜单的逻辑收不到事件 */
      .card.menu-open { -webkit-app-region: no-drag; }
      #items { display: flex; align-items: center; gap: 12px; min-width: 0; overflow: hidden; }
      .item { display: flex; align-items: center; gap: 5px; font-size: 12px; line-height: 1; }
      .dot {
        width: 8px; height: 8px; border-radius: 50%;
        box-shadow: 0 0 0 1px rgba(255,255,255,0.06);
      }
      .dot.done       { background: #22c55e; box-shadow: 0 0 6px rgba(34,197,94,0.55); }
      .dot.attention  { background: #eab308; box-shadow: 0 0 6px rgba(234,179,8,0.55); }
      .dot.busy       { background: #3b82f6; box-shadow: 0 0 6px rgba(59,130,246,0.55); }
      .dot.total      { background: #9ca3af; }
      .num { font-weight: 600; font-variant-numeric: tabular-nums; }
      .label { color: #9ca3af; font-size: 11px; margin-left: 2px; }

      /* ── 右键菜单：与主界面 .ctx 同款（浅色） ── */
      .ctx {
        position: fixed; z-index: 60; min-width: 160px;
        background: #ffffff;
        border-radius: 8px;
        box-shadow: 0 0 0 1px #0000000d, 0 1px 1px #00000005, 0 8px 16px -4px #0000000a, 0 24px 32px -8px #0000000f;
        padding: 5px;
        display: none;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        -webkit-app-region: no-drag;
        cursor: default;
      }
      .ctx.open { display: block; }
      .ctx-item {
        display: flex; align-items: center; gap: 10px;
        padding: 8px 10px;
        border-radius: 6px;
        cursor: pointer; font-size: 13px;
        color: #171717;
      }
      .ctx-item:hover { background: #fafafa; }
      .ctx-item .ic {
        flex: 0 0 14px; color: #888;
        display: inline-grid; place-items: center; line-height: 1;
      }
      .ctx-item.danger { color: #ee0000; }
      .ctx-item.danger .ic { color: #ee0000; }
      .ctx-sep { height: 1px; background: #ebebeb; margin: 4px 6px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div id="items"></div>
    </div>
    <div id="ctx" class="ctx"></div>
    <script type="module" src="./src/floater-bootstrap.ts"></script>
  </body>
</html>
