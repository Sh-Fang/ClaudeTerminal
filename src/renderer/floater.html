<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>Floater</title>
    <style>
      html, body {
        margin: 0; padding: 0; height: 100%;
        background: transparent;
        user-select: none; -webkit-user-select: none;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        color: #f5f5f5;
        overflow: hidden;
        cursor: default;
      }
      /* 卡片：pill 风、深色半透明、固定 100×30 在左上角，不随窗口拉伸。
         窗口被菜单撑大时，空出来的区域就是菜单的位置；card 永远是 pill 自己。
         去掉外 drop-shadow —— 窗口透明，阴影投在空气里看着像污渍 */
      .card {
        box-sizing: border-box;
        position: absolute;
        top: 0; left: 0;
        width: 130px; height: 34px;
        background: rgba(40, 40, 42, 0.94);
        border-radius: 17px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        padding: 0 10px;
        display: flex; align-items: center; justify-content: center;
        -webkit-app-region: drag;
        backdrop-filter: blur(12px);
        color: #f5f5f5;
      }
      /* 菜单期间：切到 no-drag，让 mousedown 能正常派发到 renderer 关菜单
         （drag 区域 OS 会把 mousedown 抢走） */
      .card.menu-open { -webkit-app-region: no-drag; }
      #items {
        display: flex; align-items: center; gap: 9px;
        flex: 1; min-width: 0; overflow: hidden;
        justify-content: center;
      }
      .item {
        display: flex; align-items: center; gap: 5px;
        font-size: 12px; line-height: 1;
        flex: 0 0 auto;
      }
      .dot {
        flex: 0 0 7px;
        width: 7px; height: 7px; border-radius: 50%;
      }
      .dot.done       { background: #22c55e; }
      .dot.attention  { background: #eab308; }
      .dot.busy       { background: #3b82f6; }
      .dot.total      { background: #9ca3af; }
      .num { font-weight: 600; font-variant-numeric: tabular-nums; }
      .sep {
        flex: 0 0 1px;
        width: 1px; height: 14px;
        background: rgba(255, 255, 255, 0.18);
      }

      /* ── 右键菜单：与主界面 .ctx 同款（浅色） ── */
      .ctx {
        position: fixed; z-index: 60; min-width: 160px;
        background: #ffffff;
        border-radius: 8px;
        box-shadow: 0 0 0 1px #0000000d, 0 1px 1px #00000005, 0 8px 16px -4px #0000000a, 0 24px 32px -8px #0000000f;
        padding: 5px;
        display: none;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        -webkit-app-region: no-drag;
        cursor: default;
      }
      .ctx.open { display: block; }
      .ctx-item {
        display: flex; align-items: center; gap: 10px;
        padding: 8px 10px;
        border-radius: 6px;
        cursor: pointer; font-size: 13px;
        color: #171717;
      }
      .ctx-item:hover { background: #fafafa; }
      .ctx-item .ic {
        flex: 0 0 14px; color: #888;
        display: inline-grid; place-items: center; line-height: 1;
      }
      .ctx-item.danger { color: #ee0000; }
      .ctx-item.danger .ic { color: #ee0000; }
      .ctx-sep { height: 1px; background: #ebebeb; margin: 4px 6px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div id="items"></div>
    </div>
    <div id="ctx" class="ctx"></div>
    <script type="module" src="./src/floater-bootstrap.ts"></script>
  </body>
</html>
